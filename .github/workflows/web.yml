name: Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if it has
      # drifted from package.json. That drift is exactly what previously let a
      # lockfile without jest sit alongside a package.json that declared it,
      # so the test suite silently never ran.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Also enforces the coverage floor in jest.config.js (see CONTRIBUTING.md).
      - name: Test
        run: npm run test:ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          ANALYZE: "true"

      # ── Bundle size budget ────────────────────────────────────────────────
      # Guards against accidentally re-introducing large un-tree-shaken chunks
      # of @stellar/stellar-sdk (see issues #96 / #97 / #235).
      # size-limit reads .size-limit.json; adjust budgets there when the
      # baseline legitimately changes, so reviewers can see the intent.
      # Budgets are kept ~7% above the measured gzip sizes (411.8 kB total,
      # 44.8 kB framework) so a real regression fails instead of hiding in
      # slack; bump them in the same PR as the change that grows the bundle.
      - name: Bundle size check
        run: npm run size

      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium

      # Lighthouse category score floors complement the JavaScript bundle budget.
      - name: Performance and accessibility budgets
        run: |
          export CHROME_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload bundle module analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: .next/analyze/*.html
          if-no-files-found: warn
          retention-days: 7

  # ── End-to-end tests ────────────────────────────────────────────────────────
  # Exercises the transfer, claim, tokenize and issuer-gating flows in a real browser against a dev
  # server, with all Soroban RPC and REST API calls intercepted by Playwright
  # route handlers. Runs in a separate job so a slow e2e suite doesn't block
  # the unit-test result, and so its resource requirements are isolated.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
